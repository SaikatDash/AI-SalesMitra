services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sys449420
      POSTGRES_DB: salesmitra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s 
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile #start building from project root
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:sys449420@db:5432/salesmitra
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: